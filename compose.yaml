services:
  folio:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/folio.db
    volumes:
      - folio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  folio-data:
